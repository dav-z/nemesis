<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Solid Color Background */
        body {
            background-color: #242424; 
            
            /* Viewport height ensures it covers the whole screen */
            min-height: 100vh;
            
            /* Flexbox to center the content on the screen */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container for the logo and text */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            /* Increased space between logo and text */
            gap: 60px; 
        }

        /* Logo Styling */
        .logo {
            max-width: 90vw; 
            width: 600px; 
            height: auto;
        }

        /* Text Styling */
        .coming-soon-text {
            color: #f5d796; 
            /* Changed font to match the TTF file specified */
            font-family: "HAL Timezone Mono", monospace;
            font-weight: normal; 
            font-size: 1.0rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            /* Slightly softened text shadow to fit the flat background */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5); 
        }

        /* Defining the custom font */
        @font-face {
            font-family: 'HAL Timezone Mono';
            /* Assuming the provided file content was from a local font file */
            src: url('HALTimezoneMono-Book.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <img src="nemesis-foundation-logo-w_o-L.png" alt="Nemesis Foundation" class="logo">
        <div class="coming-soon-text">website coming soon</div>
    </div>

</body>
</html>
